name: AI Test Loop

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Code format check (black)
      id: black
      continue-on-error: true
      run: |
        black --check .
    
    - name: Lint with flake8
      id: flake8
      continue-on-error: true
      run: |
        flake8 src/ tests/
    
    - name: Type check with mypy
      id: mypy
      continue-on-error: true
      run: |
        mypy src/
    
    - name: Run tests with pytest
      id: pytest
      continue-on-error: true
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing
    
    - name: Comment PR on failure
      if: |
        always() && 
        github.event_name == 'pull_request' && 
        (steps.black.outcome == 'failure' || 
         steps.flake8.outcome == 'failure' || 
         steps.mypy.outcome == 'failure' || 
         steps.pytest.outcome == 'failure')
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ Some checks failed. Please review the workflow logs for details.'
          })
